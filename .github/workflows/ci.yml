name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pre-commit/action@v3.0.1

  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/amio-dev:latest
    needs: lint
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -GNinja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DAMIO_BUILD_TESTING=ON \
            -DAMIO_BUILD_EXAMPLES=ON \
            -DAMIO_FORCE_NCZARR=ON
      - name: Build
        run: ninja -C build -j$(nproc)
      - name: Unit Tests
        run: cd build && ctest --output-on-failure -L unit --timeout 60
      - name: PBT Tests
        run: cd build && ctest --output-on-failure -L pbt --timeout 600
        env:
          RC_PARAMS: "max_success=100"

  # Build the Docker image and push to GHCR (only on main)
  docker:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/amio-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
