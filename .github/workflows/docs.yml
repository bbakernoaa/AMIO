name: Documentation
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y doxygen
          pip install -r docs/requirements.txt
          cd docs && npm install
      - name: Generate API docs (Doxygen → Moxygen)
        run: |
          doxygen docs/Doxyfile
          cd docs && npx moxygen ../docs/xml --output site/api/api-%s.md --classes --pages
      - name: Build MkDocs site
        run: cd docs && mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
